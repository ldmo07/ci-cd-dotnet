name: tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore tests/Api.Tests
      - run: dotnet format --verify-no-changes
      - run: dotnet build tests/Api.Tests --no-restore -warnaserror
      - run: dotnet test tests/Api.Tests --no-build
